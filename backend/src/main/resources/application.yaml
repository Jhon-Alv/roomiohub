spring:
  application:
    name: roomiohub-backend
  datasource:
    url: ${BD_ROOMIOHUB_URL}
    username: ${BD_ROOMIOHUB_USERNAME}
    password: ${BD_ROOMIOHUB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  jackson:
    time-zone: America/Lima

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-time: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-0000000000000000-000000-00000000000000000000000000000000-000000000}
  public-key: ${MERCADOPAGO_PUBLIC_KEY:TEST-00000000-0000-0000-0000-000000000000}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}