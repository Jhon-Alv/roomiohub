<!-- Etapa 1: Login -->
<div class="h-screen w-full flex font-inter">
  
  <!-- Lado Izquierdo (Formulario) -->
  <div class="w-full lg:w-1/2 bg-neutral-light flex flex-col items-center justify-center p-8 relative">
    <div class="max-w-sm w-full text-center mb-10">
      <div class="flex items-center justify-center gap-3 mb-2">
        <img src="/logo_roomiohub.svg" alt="RoomioHub Logo" class="h-10 w-auto">
        <h1 class="text-4xl font-bold font-jakarta text-primary">RoomioHub</h1>
      </div>
      <p class="text-neutral-dark/70 font-medium text-sm">Gestiona más. Preocúpate menos.</p>
    </div>

    <!-- Formulario Normal -->
    @if (!showChangePasswordModal()) {
      <form class="max-w-sm w-full space-y-6" (ngSubmit)="onLogin()">
        <div>
          <label for="username" class="block text-sm font-medium text-neutral-dark mb-1.5">Usuario</label>
          <input type="text" id="username" name="username" [ngModel]="username()" (ngModelChange)="username.set($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Ej. LOSOLIVOS" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-neutral-dark mb-1.5">Contraseña</label>
          <input type="password" id="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="••••••••" />
        </div>
        
        <button [disabled]="isLoading()" type="submit" class="flex justify-center items-center w-full bg-primary text-white font-medium py-3 rounded-lg hover:bg-primary/90 transition-colors shadow-sm mt-4 disabled:opacity-75 disabled:cursor-not-allowed">
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          }
          Ingresar a la plataforma
        </button>
      </form>
    } 

    <!-- Formulario Cambio de Contraseña -->
    @if (showChangePasswordModal()) {
      <form class="max-w-sm w-full space-y-6" (ngSubmit)="onChangePassword()">
        <div class="p-4 bg-amber-50 rounded-xl border border-amber-200 mb-6">
          <p class="text-sm text-amber-800 font-medium text-center">Por seguridad interina, debes establecer una nueva contraseña antes de continuar.</p>
        </div>

        <div>
          <label for="newPassword" class="block text-sm font-medium text-neutral-dark mb-1.5">Nueva Contraseña</label>
          <input type="password" id="newPassword" name="newPassword" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" placeholder="••••••••" />
        </div>
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-neutral-dark mb-1.5">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-all" placeholder="••••••••" />
        </div>
        
        <div class="flex gap-3 mt-4">
          <button type="button" [disabled]="isLoading()" (click)="showChangePasswordModal.set(false); isLoading.set(false)" class="w-full bg-white border border-gray-300 text-neutral-dark font-medium py-3 rounded-lg hover:bg-gray-50 transition-colors shadow-sm disabled:opacity-75">
            Cancelar
          </button>
          <button type="submit" [disabled]="isLoading()" class="flex justify-center items-center w-full bg-secondary text-white font-medium py-3 rounded-lg hover:bg-secondary/90 transition-colors shadow-sm disabled:opacity-75">
            @if (isLoading()) {
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            }
            Guardar
          </button>
        </div>
      </form>
    }
  </div>

  <!-- Lado Derecho (Cover) -->
  <div class="hidden lg:flex w-1/2 bg-primary relative items-center justify-center overflow-hidden">
    <!-- Círculos decorativos abstractos de fondo -->
    <div class="absolute w-96 h-96 bg-white/5 rounded-full -top-20 -right-20 blur-3xl"></div>
    <div class="absolute w-125 h-125 bg-tertiary/20 rounded-full -bottom-32 -left-32 blur-3xl"></div>
  </div>

</div>
