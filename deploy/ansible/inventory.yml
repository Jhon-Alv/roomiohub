---
# ============================================================
# inventory.yml
# Configurar las vars de entorno EC2_HOST y EC2_SSH_KEY_PATH
# antes de ejecutar ansible-playbook.
# ============================================================

production:
  hosts:
    roomiohub:
      ansible_host: "{{ lookup('env', 'EC2_HOST') }}"
      ansible_user: ec2-user
      ansible_ssh_private_key_file: "{{ lookup('env', 'EC2_SSH_KEY_PATH') }}"
